<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>요청 로그</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/logs.js" defer></script>

<body>
  <main>
    <header>
      <h1>요청 로그</h1>
      <a href="/">웹 요청 보내기</a>

    <button id="refresh" type="button">새로고침</button>

      <section><h2>최근 요청</h2><ul id="all"></ul></section>
      <section><h2>위험 로그</h2><ul id="flagged"></ul></section>
      <section><h2>요청 원문</h2><pre id="detail">목록에서 로그를 선택하세요.</pre></section>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

</html>
